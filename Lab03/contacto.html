
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <header>
    <h1 id="main-title" class="title">Plataforma Educativa</h1>
    <h2 class="title">Universidad Central</h2>

    <!-- Menú -->
    <nav class="nav-menu">
      <ul class="nav-list">
        <li class="menu-item"><a href="index.html">Inicio</a></li>
        <li class="menu-item"><a href="cursos.html">Cursos</a></li>
        <li class="menu-item"><a href="contacto.html">Contacto</a></li>
        <li class="menu-item"><a href="ayuda.html">Ayuda</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    <section class="contacto-card">
      <form action="mailto:info@universidadcentral.edu"
            method="post"
            enctype="text/plain">

        <h2>Contacto</h2>

        <p>
          Si tienes alguna pregunta o necesitas asistencia,
          no dudes en contactarnos a través del siguiente formulario:
        </p>

        <div class="form-group">
          <label class="form-label" for="nombre">Nombre:</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder=" Nombre completo"
            class="form-input"
            required>
        </div>

        <div class="form-group">
          <label class="form-label" for="correo">
            Correo electrónico:
          </label>
          <input
            type="email"
            id="correo"
            name="correo"
            placeholder=" ejemplo@correo.com"
            class="form-input"
            required>
        </div>

        <div class="form-group">
          <label class="form-label" for="mensaje">Mensaje:</label>
          <textarea
            id="mensaje"
            name="mensaje"
            placeholder=" Escriba su consulta"
            class="form-input"
            rows="5"
            required></textarea>
        </div>

        <button type="submit" class="submit-button">Enviar</button>

      </form>
    </section>
  </main>
</body>
</html>
